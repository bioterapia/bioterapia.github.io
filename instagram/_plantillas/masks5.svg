<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
<defs>
  <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="38"/>
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.93 0 0 0 0 0.5 0 0 0 0 0.6 0 0 0 .18 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <radialGradient id="pk" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#FBD3DC"/><stop offset=".7" stop-color="#F6B7C5"/><stop offset="1" stop-color="#F2A5B6"/></radialGradient>
  <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE6E6"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#B0687C" flood-opacity=".28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <g id="mask"><path d="M-82,-118 C-30,-138 30,-138 82,-118 C98,-60 96,10 74,60 C52,108 22,128 0,130 C-22,128 -52,108 -74,60 C-96,10 -98,-60 -82,-118 Z" fill="url(#mk)" filter="url(#sh)"/></g>
  <g id="leaf"><path d="M0,0 C10,-18 30,-22 44,-18 C34,-6 18,2 0,0 Z"/></g>
</defs>
<!-- watercolor blob -->
<circle cx="300" cy="300" r="250" fill="url(#pk)" filter="url(#wc)" opacity=".85"/>
<circle cx="300" cy="300" r="250" fill="#000" filter="url(#grain)" opacity=".6"/>
<g fill="#F2A5B6" opacity=".55" filter="url(#soft)">
  <circle cx="70" cy="140" r="9"/><circle cx="95" cy="110" r="5"/><circle cx="540" cy="420" r="10"/><circle cx="520" cy="460" r="5"/><circle cx="470" cy="80" r="6"/>
</g>
<g fill="#8FCDB5" opacity=".6" filter="url(#soft)"><circle cx="110" cy="470" r="8"/><circle cx="140" cy="500" r="4"/><circle cx="500" cy="140" r="5"/></g>

<!-- sprigs -->
<g transform="translate(110,250) rotate(-70)">
  <path d="M0,0 C40,-10 90,-10 150,0" stroke="#6FB59B" stroke-width="3" fill="none"/>
  <g fill="#8FCDB5" opacity=".9">
    <use href="#leaf" transform="translate(30,-3) rotate(-30)"/><use href="#leaf" transform="translate(30,-3) rotate(150) scale(1,-1)"/>
    <use href="#leaf" transform="translate(70,-6) rotate(-30)"/><use href="#leaf" transform="translate(70,-6) rotate(150) scale(1,-1)"/>
    <use href="#leaf" transform="translate(110,-4) rotate(-30)"/><use href="#leaf" transform="translate(110,-4) rotate(150) scale(1,-1)"/>
  </g>
</g>
<g transform="translate(500,330) rotate(-110)">
  <path d="M0,0 C40,-8 90,-8 160,0" stroke="#9C5A8C" stroke-width="3" fill="none"/>
  <g fill="#B67AA8" opacity=".85">
    <use href="#leaf" transform="translate(30,-3) rotate(-30)"/><use href="#leaf" transform="translate(30,-3) rotate(150) scale(1,-1)"/>
    <use href="#leaf" transform="translate(75,-5) rotate(-30)"/><use href="#leaf" transform="translate(75,-5) rotate(150) scale(1,-1)"/>
    <use href="#leaf" transform="translate(120,-4) rotate(-30)"/><use href="#leaf" transform="translate(120,-4) rotate(150) scale(1,-1)"/>
  </g>
</g>
<g transform="translate(360,560) rotate(-35)">
  <path d="M0,0 C40,-8 90,-8 130,0" stroke="#E98AA0" stroke-width="3" fill="none"/>
  <g fill="#F3A3B5" opacity=".9">
    <use href="#leaf" transform="translate(30,-3) rotate(-30)"/><use href="#leaf" transform="translate(30,-3) rotate(150) scale(1,-1)"/>
    <use href="#leaf" transform="translate(75,-5) rotate(-30)"/><use href="#leaf" transform="translate(75,-5) rotate(150) scale(1,-1)"/>
  </g>
</g>

<g transform="translate(300,195) scale(0.82) rotate(0)"><use href="#mask"/><g transform="translate(0,-155) scale(1.5) translate(0,155)"><g><path d="M70,-150 q-10,60 -40,40" stroke="#9C5A8C" stroke-width="2" fill="none"/><ellipse cx="70" cy="-178" rx="24" ry="30" fill="#F6A9BA" stroke="#EE7F97" stroke-width="2.5"/><path d="M66,-148 l8,0 -4,6z" fill="#EE7F97"/></g></g>
<g stroke="#4C3F47" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M-42,-26 q12,-8 24,-2"/><path d="M18,-28 q12,-6 24,2"/><circle cx="-28" cy="2" r="5" fill="#4C3F47" stroke="none"/><circle cx="28" cy="2" r="5" fill="#4C3F47" stroke="none"/><path d="M-20,56 q20,20 40,0"/></g><path transform="translate(0,-74) scale(1.5) translate(0,74)" d="M0,-92 l7,15 16,2 -12,11 3,16 -14,-8 -14,8 3,-16 -12,-11 16,-2Z" fill="#F6A9BA" stroke="#EE7F97" stroke-width="2.5" stroke-linejoin="round"/></g>
<g transform="translate(170,405) scale(0.78) rotate(-6)"><use href="#mask"/>
<g stroke="#4C3F47" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M-44,-14 q14,-12 28,-4"/><path d="M44,-14 q-14,-12 -28,-4"/><path d="M-40,4 q12,-6 24,0"/><path d="M16,4 q12,-6 24,0"/><path d="M-24,64 q8,-8 16,0 q8,8 16,0 q8,-8 16,0"/></g><g transform="translate(0,-72) scale(1.45) translate(0,72)"><path d="M0,-96 l22,8 v14 c0,14 -10,22 -22,28 c-12,-6 -22,-14 -22,-28 v-14Z" fill="#A9DCC7" stroke="#6FB59B" stroke-width="3" stroke-linejoin="round"/><path d="M-9,-72 l6,6 12,-12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>
<g transform="translate(430,405) scale(0.78) rotate(6)"><use href="#mask"/><g transform="translate(0,-155) scale(1.5) translate(0,155)"><g transform="translate(78,-150)"><ellipse cx="0" cy="0" rx="22" ry="28" fill="#fff" stroke="#9C5A8C" stroke-width="4"/><path d="M-8,-10 q6,-8 14,-4" stroke="#A9DCC7" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M0,28 v26" stroke="#9C5A8C" stroke-width="5" stroke-linecap="round"/></g></g>
<g stroke="#4C3F47" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M-42,-2 q12,-12 24,0"/><path d="M18,-2 q12,-12 24,0"/><path d="M-26,54 q30,22 54,-6"/></g></g>
</svg>