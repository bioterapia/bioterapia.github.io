<g transform="translate(170,405) scale(0.78) rotate(-6)"><use href="#mask"/><g transform="translate(0,-155) scale(1.5) translate(0,155)"><g transform="translate(-70,-150) rotate(-20)"><path d="M-22,10 c0,-20 6,-34 12,-34 c5,0 5,8 5,16 c0,-14 2,-20 7,-20 c5,0 5,8 5,18 c0,-12 2,-16 6,-16 c5,0 5,8 5,22 c4,-6 10,-6 10,0 c0,16 -12,34 -30,34 c-14,0 -20,-8 -20,-20Z" fill="#fff" stroke="#9C5A8C" stroke-width="3.5" stroke-linejoin="round"/></g></g>
<g stroke="#4C3F47" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M-40,0 q12,8 24,0"/><path d="M16,0 q12,8 24,0"/><ellipse cx="0" cy="62" rx="10" ry="8"/></g><circle cx="-40" cy="34" r="11" fill="#F6B3C2" opacity=".6"/></g>
<g transform="translate(430,405) scale(0.78) rotate(6)"><use href="#mask"/><g transform="translate(0,-155) scale(1.5) translate(0,155)"><g transform="translate(0,-150)"><rect x="-44" y="-6" width="40" height="34" rx="4" fill="#F6A9BA" stroke="#EE7F97" stroke-width="3"/><rect x="2" y="-6" width="40" height="34" rx="4" fill="#A9DCC7" stroke="#6FB59B" stroke-width="3"/><rect x="-22" y="-42" width="40" height="34" rx="4" fill="#E9D3E4" stroke="#9C5A8C" stroke-width="3"/><path d="M-24,11 h0 M-2,-25 h0" /></g></g>
<g stroke="#4C3F47" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M-44,-14 L-18,-10"/><path d="M44,-14 L18,-10"/><path d="M-40,0 q12,-6 24,0"/><path d="M16,0 q12,-6 24,0"/><path d="M-22,62 L22,62"/></g></g>
